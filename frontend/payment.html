<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose Payment Method</title>
    <link rel="stylesheet" href="/css/payment.css" />
    <style>
      body { margin: 0; padding: 32px 16px; font-family: Arial, sans-serif; background: #f6f7fb; color: #241733; }
      .payment-container { max-width: 760px; margin: 0 auto; }
      .payment-card { background: white; color: #241733; border-radius: 22px; padding: 30px; box-shadow: 0 18px 42px rgba(16,24,40,0.08); }
      .eyebrow { color: #8b5cf6; font-size: 0.8rem; letter-spacing: 0.16em; font-weight: 800; text-transform: uppercase; }
      .amount-box { background: #f7f2ff; border: 1px solid rgba(139,92,246,0.15); border-radius: 14px; padding: 18px; margin: 20px 0; }
      .checkout-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; padding: 16px; border: 1px solid #e8defa; border-radius: 14px; background: #faf8ff; }
      .checkout-details p { overflow-wrap: anywhere; color: #241733; }
      .checkout-details strong { color: #5f566b; }
      .payment-options { display: grid; gap: 12px; margin: 18px 0; }
      .payment-option {
        display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #fff;
        border: 1px solid rgba(16,24,40,0.12); border-radius: 12px; cursor: pointer;
      }
      .payment-option input { width: auto; margin: 0; }
      .payment-option strong { display: block; }
      .payment-option small { color: #667085; }
      .payment-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: #eee5ff; }
      .message { min-height: 22px; margin: 12px 0; color: #991b1b; }
      .main-button, .back-button { width: 100%; border: none; padding: 14px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; }
      .main-button { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; }
      .back-button { background: transparent; border: 1px solid rgba(16,24,40,0.12); margin-top: 12px; }
      @media (max-width: 600px) { .payment-card { padding: 24px 18px; } .checkout-details { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js" defer></script>
  </head>
  <body>
    <main class="payment-container">
      <section class="payment-card">
        <p class="eyebrow">Secure checkout</p>
        <h1>Choose payment method</h1>
        <p class="subtitle">Select a method to confirm your appointment.</p>

        <div class="amount-box">
          <span>Total amount</span>
          <strong id="paymentAmount">₹0</strong>
        </div>

        <h3>Booking details</h3>
        <div class="checkout-details" id="checkoutDetails">
          <p data-checkout-field="bookingId"><strong>Booking ID:</strong> <span id="checkoutBookingId"></span></p>
          <p data-checkout-field="customerName"><strong>Customer:</strong> <span id="checkoutCustomerName"></span></p>
          <p data-checkout-field="customerEmail"><strong>Email:</strong> <span id="checkoutCustomerEmail"></span></p>
          <p data-checkout-field="customerPhone"><strong>Phone:</strong> <span id="checkoutCustomerPhone"></span></p>
          <p data-checkout-field="serviceName"><strong>Service:</strong> <span id="checkoutServiceName"></span></p>
          <p data-checkout-field="serviceDuration"><strong>Duration:</strong> <span id="checkoutServiceDuration"></span></p>
          <p data-checkout-field="staffName"><strong>Staff:</strong> <span id="checkoutStaffName"></span></p>
          <p data-checkout-field="date"><strong>Date:</strong> <span id="checkoutDate"></span></p>
          <p data-checkout-field="time"><strong>Time:</strong> <span id="checkoutTime"></span></p>
          <p data-checkout-field="servicePrice"><strong>Service price:</strong> <span id="checkoutServicePrice"></span></p>
          <p data-checkout-field="charges"><strong>Additional charges:</strong> <span id="checkoutCharges"></span></p>
        </div>

        <h3>Payment options</h3>
        <div class="payment-options">
          <label class="payment-option"><input type="radio" name="paymentMethod" value="UPI" /><span class="payment-icon">₹</span><span><strong>UPI</strong><small>Pay with any UPI app</small></span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="QR Code" /><span class="payment-icon">◉</span><span><strong>QR Code</strong><small>Scan the QR code</small></span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Card" /><span class="payment-icon">💳</span><span><strong>Card</strong><small>Visa, Mastercard or any card</small></span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Cash" /><span class="payment-icon">💵</span><span><strong>Cash</strong><small>Pay at the venue</small></span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Pay at Business" /><span class="payment-icon">🏢</span><span><strong>Pay at Business</strong><small>Arrange payment when you visit</small></span></label>
          <label class="payment-option"><input type="radio" name="paymentMethod" value="Net Banking" /><span class="payment-icon">🏦</span><span><strong>Net Banking</strong><small>Pay through your bank</small></span></label>
        </div>

        <p id="paymentMessage" class="message"></p>

        <button class="main-button" id="payButton" type="button">Confirm Payment →</button>
        <button class="back-button" type="button" onclick="history.back()">← Back to summary</button>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/payment.js"></script>
  </body>
</html>
