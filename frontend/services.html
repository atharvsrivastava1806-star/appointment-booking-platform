<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services | Business Booking</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .hero { padding: 72px 0 40px; }
      .service-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 20px; }
      .service-card {
        background: white; border: 1px solid rgba(16,24,40,0.08); border-radius: 20px; padding: 24px; box-shadow: 0 18px 40px rgba(16,24,40,0.04);
      }
      .service-card h3 { margin-bottom: 8px; }
      .service-card p { color: #667085; }
      .service-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
      .service-cta { margin-top: 20px; }
      @media (max-width: 900px) { .service-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
      @media (max-width: 600px) { .service-grid { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js" defer></script>
  </head>
  <body data-authentication-required>
    <header>
      <div class="container navbar">
        <a href="/" class="brand">
          <img data-brand-logo src="/assets/logo-placeholder.svg" alt="Business logo" />
          <span data-brand-name>Business Name</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/">Home</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-primary" href="/booking.html">Book Now</a>
          <button class="mobile-toggle" aria-label="Open menu">☰</button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container section-header">
          <p>Our services</p>
          <h2>Premium experiences for every need</h2>
          <span>Choose the right service and book it in minutes.</span>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="servicesGrid" class="service-grid"></div>
        </div>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
    <script>
      const servicesGrid = document.getElementById("servicesGrid");
      const escapeServiceHTML = (value) => String(value == null ? "" : value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
      (async () => {
        if (!localStorage.getItem("customerToken") && !localStorage.getItem("adminToken")) {
          window.location.replace(window.shopRoute ? window.shopRoute("/login.html") : "/login.html");
          return;
        }
        try {
          const services = await window.apiFetch("/api/services");
          servicesGrid.innerHTML = (Array.isArray(services) ? services : []).map((service) => `
            <article class="service-card">
              <div class="eyebrow" style="margin-bottom: 10px;">${escapeServiceHTML(service.category || "General")}</div>
              <h3>${escapeServiceHTML(service.name)}</h3>
              <p>${escapeServiceHTML(service.description || "")}</p>
              <div class="service-meta">
                <span>${escapeServiceHTML(service.duration || 30)} min</span>
                <strong style="color:#8b5cf6; font-size:1.3rem;">₹${escapeServiceHTML(service.price || 0)}</strong>
              </div>
              <div class="service-cta">
                <a class="btn btn-primary" href="/booking.html?serviceId=${encodeURIComponent(service._id)}">Book now</a>
              </div>
            </article>
          `).join("") || '<div class="empty-state">No services available yet.</div>';
        } catch (error) {
          servicesGrid.innerHTML = '<div class="empty-state">Unable to load services right now.</div>';
        }
      })();
    </script>
  </body>
</html>
