<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking summary</title>
    <link rel="stylesheet" href="/css/payment.css" />
    <style>
      body { margin: 0; padding: 32px 16px; background: #f6f7fb; font-family: "Segoe UI", Arial, sans-serif; color: #241733; }
      .payment-container { max-width: 760px; margin: 0 auto; }
      .summary-card { background: #fff; color: #241733; border-radius: 22px; padding: clamp(22px, 5vw, 36px); box-shadow: 0 18px 42px rgba(16,24,40,0.08); }
      .summary-card h1 { color: #241733; font-size: clamp(1.7rem, 4vw, 2.2rem); margin: 0 0 20px; }
      .eyebrow { color: #7440d4; font-size: 0.8rem; letter-spacing: 0.16em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
      .summary-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 22px 0; }
      .summary-item { min-width: 0; background: #faf8ff; border: 1px solid #e8defa; border-radius: 12px; padding: 14px 16px; overflow-wrap: anywhere; }
      .summary-item span { display: block; color: #5f566b; font-size: 0.88rem; margin-bottom: 4px; }
      .summary-item strong { color: #241733; font-size: 1rem; }
      .summary-item small { display: block; color: #5f566b; margin-top: 4px; }
      .total-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 18px; border-top: 1px solid #e8e1ef; font-size: 1.15rem; font-weight: 700; }
      .total-row strong { color: #5530a7; font-size: 1.65rem; }
      .main-button { width: 100%; border: none; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: #fff; padding: 14px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 22px; }
      .main-button:disabled { cursor: not-allowed; opacity: 0.55; }
      .summary-message { color: #8b1e2d; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 10px; padding: 12px 14px; margin: 16px 0; }
      .summary-note { color: #5f566b; margin-top: 16px; font-size: 0.92rem; }
      @media (max-width: 600px) { body { padding: 20px 12px; } .summary-details { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js" defer></script>
  </head>
  <body>
    <main class="payment-container">
      <section class="summary-card">
        <p class="eyebrow">Your appointment</p>
        <h1>Booking summary</h1>

        <p id="bookingError" class="summary-message" role="alert" hidden></p>

        <div class="summary-details">
          <div class="summary-item" data-summary-field="bookingId"><span>Booking ID</span><strong id="bookingId"></strong></div>
          <div class="summary-item" data-summary-field="customerName"><span>Customer</span><strong id="customerName"></strong></div>
          <div class="summary-item" data-summary-field="customerEmail"><span>Email</span><strong id="customerEmail"></strong></div>
          <div class="summary-item" data-summary-field="customerPhone"><span>Phone</span><strong id="customerPhone"></strong></div>
          <div class="summary-item" data-summary-field="serviceName"><span>Selected service</span><strong id="serviceName"></strong></div>
          <div class="summary-item" data-summary-field="serviceDuration"><span>Duration</span><strong id="serviceDuration"></strong></div>
          <div class="summary-item" data-summary-field="staffName"><span>Selected staff</span><strong id="staffName"></strong></div>
          <div class="summary-item" data-summary-field="date"><span>Appointment date</span><strong id="bookingDate"></strong></div>
          <div class="summary-item" data-summary-field="time"><span>Appointment time</span><strong id="bookingTime"></strong></div>
          <div class="summary-item" data-summary-field="servicePrice"><span>Service price</span><strong id="servicePrice"></strong></div>
          <div class="summary-item" data-summary-field="charges"><span>Additional charges</span><strong id="charges"></strong><small>No additional charges configured.</small></div>
        </div>

        <div class="total-row">
          <span>Final payable amount</span>
          <strong id="totalPrice"></strong>
        </div>

        <button class="main-button" id="confirmPayment" type="button" disabled>Confirm Payment →</button>
        <p class="summary-note">Your appointment details will be carried forward to checkout.</p>
      </section>
    </main>

    <script src="/js/payment-summary.js"></script>
  </body>
</html>
