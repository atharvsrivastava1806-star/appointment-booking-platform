<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Bookings</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js" defer></script>
    <style>
      body { min-height: 100vh; padding: 92px 16px 40px; }
      .my-bookings { width: min(920px, 100%); margin: 0 auto; }
      .my-bookings h1 { margin-bottom: 8px; }
      .my-bookings-intro, .booking-card p { color: var(--theme-muted); }
      .booking-list { display: grid; gap: 14px; margin-top: 24px; }
      .booking-card { padding: 20px; border: 1px solid var(--theme-border); border-radius: 16px; background: var(--theme-surface); color: var(--theme-text); box-shadow: 0 8px 26px rgba(20, 12, 32, 0.08); }
      .booking-card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .booking-card h2 { margin: 0; font-size: 1.15rem; }
      .booking-status { padding: 5px 9px; border-radius: 999px; background: var(--theme-surface-raised); color: var(--theme-text); font-size: 0.82rem; font-weight: 700; }
      .booking-card dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; margin: 16px 0 0; }
      .booking-card dl div { min-width: 0; }
      .booking-card dt { color: var(--theme-muted); font-size: 0.85rem; }
      .booking-card dd { margin: 3px 0 0; font-weight: 650; overflow-wrap: anywhere; }
      .bookings-message { padding: 14px 16px; border: 1px solid var(--theme-border); border-radius: 12px; background: var(--theme-surface); }
      @media (max-width: 560px) {
        body { padding: 82px 12px 28px; }
        .booking-card dl { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="my-bookings">
      <p class="eyebrow">Your account</p>
      <h1>My Bookings</h1>
      <p class="my-bookings-intro">Appointments booked while signed in to your customer account are listed here.</p>
      <div id="bookingsMessage" class="bookings-message" role="status" aria-live="polite">Loading your bookings…</div>
      <section id="bookingList" class="booking-list" aria-label="Your appointments"></section>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/my-bookings.js"></script>
  </body>
</html>
