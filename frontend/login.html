<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Login | Business Booking</title>
    <meta name="description" content="Sign in or create a customer account to book appointments." />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <script src="/js/theme.js" defer></script>
  </head>
  <body data-auth-role="customer">
    <div class="auth-shell">
      <div class="auth-panel primary">
        <p class="eyebrow" style="color: #d9c5ff;">Appointments made easier</p>
        <h2>Welcome, Customer</h2>
        <p>Sign in or create a customer account to find services and manage your appointments.</p>
        <a class="auth-home-link" href="/">Back to home</a>
      </div>
      <div class="auth-panel">
        <h2 id="authHeading">Customer Login</h2>
        <form id="authForm" autocomplete="on">
          <div id="authNameField" hidden>
            <label for="authName">Name</label>
            <input id="authName" type="text" maxlength="80" autocomplete="name" />
          </div>
          <div>
            <label for="authEmail">Email</label>
            <input id="authEmail" type="email" autocomplete="email" required />
          </div>
          <div>
            <label for="authPassword">Password</label>
            <input id="authPassword" type="password" minlength="8" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary" id="authSubmit" type="submit">Customer Login</button>
        </form>
        <button class="auth-switch" id="authModeToggle" type="button">New customer? Create an account</button>
        <div class="auth-message" id="authMessage" role="status" aria-live="polite"></div>
        <a class="auth-account-link" href="/salon-owner-login.html">Are you a salon owner?</a>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-page.js"></script>
  </body>
</html>
